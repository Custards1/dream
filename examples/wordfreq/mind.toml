[package]
name = "wordfreq"
version = "0.1.0"
description = "Word frequencies, through the textstats package"

# A path dependency. The path is relative to this manifest, and the key is the
# name it is imported by -- so what `import textstats.tokenize` means does not
# depend on where either package sits on disk.
[dependencies]
textstats = "../textstats"
