# The compiler. Its modules are in src/, and `dreams.main` is the program;
# build.dr beside this declares the checks `mind test dreams` runs.
[package]
name = "dreams"
version = "0.1.0"
description = "The Dream compiler: .dr source to .dream bytecode"

[vm]
# A compile keeps a lot alive for a pass at a time. Measured at 64 MB against
# the VM's 32 MB a self-compile was no slower and held no more; see "Strict
# builtins and pinned forces" in docs/notes/vm-performance.md.
nursery_max = "64M"
