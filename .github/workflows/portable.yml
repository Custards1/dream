name: Portable Dream images
on: [push, pull_request]

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libffi-dev
      - run: cmake -S . -B build -DDREAM_ENABLE_JIT=OFF
      - run: cmake --build build --parallel 2
      - run: python3 dream/tests/portable.py compile --vm build/bin/dream --images portable-images
      - uses: actions/upload-artifact@v4
        with:
          name: portable-images
          path: portable-images
  run:
    needs: images
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: portable-images
          path: portable-images
      # libffi is required on every platform: `std.ffi` is part of the VM.
      # Windows takes it from vcpkg, whose toolchain also copies the DLL
      # beside the executables; Homebrew's is keg-only and has to be named.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libffi-dev
      - if: runner.os == 'macOS'
        run: brew install libffi
      - if: runner.os == 'Windows'
        run: vcpkg install libffi:x64-windows
      - if: runner.os == 'Linux'
        run: cmake -S . -B build -DDREAM_ENABLE_JIT=OFF
      - if: runner.os == 'macOS'
        run: cmake -S . -B build -DDREAM_ENABLE_JIT=OFF -DCMAKE_PREFIX_PATH="$(brew --prefix libffi)"
      - if: runner.os == 'Windows'
        run: cmake -S . -B build -DDREAM_ENABLE_JIT=OFF -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release -R "^dream_tests$" --output-on-failure
      - if: runner.os != 'Windows'
        run: python3 dream/tests/portable.py run --vm build/bin/dream --images portable-images
      - if: runner.os == 'Windows'
        run: python dream/tests/portable.py run --vm build/bin/Release/dream.exe --images portable-images
